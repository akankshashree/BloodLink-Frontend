<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications | BloodLink</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<style>

        :root {
            --red: #c81d25;
            --red-dark: #a9151d;
            --soft-red: #fff1f2;
            --dark: #171717;
            --muted: #6b7280;
            --border: #eeeeee;
            --background: #f8f8f8;
            --green: #16803c;
            --soft-green: #ecfdf3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--background);
            color: var(--dark);
            font-family: "DM Sans", sans-serif;
        }

        h1, h2, h3, h4, h5 {
            font-family: "Manrope", sans-serif;
        }

        /* NAVBAR */

        .navbar {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 14px 0;
        }

        .brand {
            text-decoration: none;
            color: var(--dark);
            font-family: "Manrope", sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
        }

        .brand span {
            color: var(--red);
        }

        .nav-link-custom {
            color: #555;
            text-decoration: none;
            font-weight: 600;
            font-size: .9rem;
        }

        .nav-link-custom:hover {
            color: var(--red);
        }

        /* PAGE */

        .page {
            padding: 42px 0 70px;
        }

        .eyebrow {
            color: var(--red);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: .73rem;
            font-weight: 800;
        }

        .page-header h1 {
            font-size: 2.55rem;
            font-weight: 800;
            margin: 6px 0 8px;
            letter-spacing: -.8px;
        }

        .page-header p {
            color: var(--muted);
            max-width: 650px;
            line-height: 1.7;
        }

        /* HEADER ACTION */

        .read-all-btn {
            border: 1px solid #ddd;
            background: white;
            color: #444;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: .8rem;
            font-weight: 800;
        }

        .read-all-btn:hover {
            border-color: var(--red);
            color: var(--red);
        }

        /* NOTIFICATION */

        .notification-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 12px;
            transition: .2s;
        }

        .notification-card.unread {
            border-left: 4px solid var(--red);
            background: #fffdfd;
        }

        .notification-card:hover {
            border-color: #ddd;
        }

        .notification-icon {
            width: 48px;
            height: 48px;
            border-radius: 13px;
            background: var(--soft-red);
            color: var(--red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .notification-icon.accepted {
            background: var(--soft-green);
            color: var(--green);
        }

        .notification-icon.declined {
            background: #fef2f2;
            color: #b91c1c;
        }

        .notification-title {
            font-weight: 800;
            font-size: .95rem;
            margin-bottom: 3px;
        }

        .notification-time {
            color: #999;
            font-size: .7rem;
        }

        .notification-message {
            color: #666;
            font-size: .82rem;
            line-height: 1.65;
            margin-top: 8px;
        }

        .unread-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--red);
            display: inline-block;
        }

        .read-btn {
            border: none;
            background: #f4f4f5;
            color: #555;
            border-radius: 8px;
            padding: 7px 10px;
            font-size: .7rem;
            font-weight: 800;
        }

        .read-btn:hover {
            background: var(--soft-red);
            color: var(--red);
        }

        /* TYPE BADGES */

        .type-badge {
            display: inline-block;
            padding: 5px 8px;
            border-radius: 50px;
            background: #f4f4f5;
            color: #666;
            font-size: .62rem;
            font-weight: 800;
            margin-top: 9px;
        }

        /* EMPTY */

        .empty-state {
            background: white;
            border: 1px dashed #d8d8d8;
            border-radius: 20px;
            padding: 65px 25px;
            text-align: center;
        }

        .empty-icon {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            background: var(--soft-red);
            color: var(--red);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 1.7rem;
        }

        .empty-state h4 {
            font-weight: 800;
        }

        .empty-state p {
            color: var(--muted);
            max-width: 470px;
            margin: 0 auto;
            line-height: 1.7;
            font-size: .84rem;
        }

        /* SIDE */

        .info-card {
            background: #181818;
            color: white;
            border-radius: 20px;
            padding: 27px;
        }

        .info-card h4 {
            font-weight: 800;
        }

        .info-card p {
            color: #bbb;
            font-size: .84rem;
            line-height: 1.7;
        }

        .info-point {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .info-point i {
            color: #ff6870;
        }

        .info-point span {
            color: #ddd;
            font-size: .8rem;
        }

        .alert {
            border: none;
            border-radius: 12px;
        }

        @media (max-width: 767px) {

            .page {
                padding: 28px 0 50px;
            }

            .page-header h1 {
                font-size: 2.15rem;
            }

            .header-actions {
                width: 100%;
            }

            .read-all-btn {
                width: 100%;
            }

            .notification-card {
                padding: 17px;
            }

        }

    </style>

<body>

<nav class="navbar sticky-top"><div class="container"><div class="d-flex justify-content-between align-items-center w-100"><a href="#" id="dashLink" class="brand"><span>🩸</span> BloodLink</a><div class="d-flex gap-3"><a href="#" id="logoutLink" class="nav-link-custom">Logout</a></div></div></div></nav>
<main class="page"><div class="container"><div class="d-flex justify-content-between align-items-end gap-4 flex-wrap mb-4"><div class="page-header"><div class="eyebrow">BloodLink alerts</div><h1>Notifications</h1><p class="mb-0">Stay updated about blood requests, donor responses and changes related to your activity.</p></div><button id="readAll" class="read-all-btn"><i class="bi bi-check2-all me-1"></i>Mark all as read</button></div><div id="errorMessage" class="alert alert-danger mb-4" style="display:none"></div><div id="notificationList"></div></div></main>
<script>
const user=requireAuth();if(user){dashLink.href=dashboardUrl();logoutLink.onclick=async e=>{e.preventDefault();await logoutUser();location.href="/";};readAll.onclick=async()=>{try{await markAllNotificationsRead();loadNotifications();}catch(e){showMessage("errorMessage",e.message);}};loadNotifications();}
async function loadNotifications(){try{const d=await getNotifications();const arr=d.results||d.notifications||d||[];notificationList.innerHTML=arr.length?arr.map(n=>`<div class="notification-card ${n.is_read?"":"unread"}"><div class="d-flex gap-3"><div class="notification-icon"><i class="bi bi-bell-fill"></i></div><div class="flex-grow-1"><div class="d-flex justify-content-between"><div><div class="notification-title">${n.is_read?"":"● "}${n.title}</div><div class="notification-time">${new Date(n.created_at).toLocaleString("en-IN")}</div></div>${n.is_read?"":`<button class="read-btn" onclick="markRead(${n.id})">Mark read</button>`}</div><div class="notification-message">${n.message}</div></div></div></div>`).join(""):`<div class="empty-state"><h4>No notifications.</h4><p>You're all caught up.</p></div>`;}catch(e){showMessage("errorMessage",e.message);}}
async function markRead(id){try{await markNotificationRead(id);loadNotifications();}catch(e){showMessage("errorMessage",e.message);}}
</script>


</body>
