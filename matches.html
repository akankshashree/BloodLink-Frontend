<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood Matches | BloodLink</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<style>

        :root {
            --red: #c81d25;
            --red-dark: #a9151d;
            --soft-red: #fff1f2;
            --dark: #171717;
            --muted: #6b7280;
            --border: #eeeeee;
            --background: #f8f8f8;
            --green: #16803c;
            --soft-green: #ecfdf3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--background);
            color: var(--dark);
            font-family: "DM Sans", sans-serif;
        }

        h1, h2, h3, h4, h5 {
            font-family: "Manrope", sans-serif;
        }

        .navbar {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 14px 0;
        }

        .brand {
            text-decoration: none;
            color: var(--dark);
            font-family: "Manrope", sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
        }

        .brand span {
            color: var(--red);
        }

        .nav-link-custom {
            color: #555;
            text-decoration: none;
            font-weight: 600;
            font-size: .9rem;
        }

        .nav-link-custom:hover {
            color: var(--red);
        }

        .page {
            padding: 42px 0 70px;
        }

        .eyebrow {
            color: var(--red);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: .73rem;
            font-weight: 800;
        }

        .page-header h1 {
            font-size: 2.55rem;
            font-weight: 800;
            margin: 6px 0 8px;
            letter-spacing: -.8px;
        }

        .page-header p {
            color: var(--muted);
            max-width: 680px;
            line-height: 1.7;
        }

        .summary-card {
            background: #181818;
            color: white;
            border-radius: 20px;
            padding: 24px;
        }

        .summary-number {
            font-family: "Manrope", sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
        }

        .summary-label {
            color: #aaa;
            font-size: .76rem;
        }

        .match-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 23px;
            margin-bottom: 15px;
        }

        .match-card.accepted {
            border-color: #b7e4c7;
        }

        .blood-badge {
            width: 55px;
            height: 55px;
            border-radius: 15px;
            background: var(--soft-red);
            color: var(--red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Manrope", sans-serif;
            font-size: .92rem;
            font-weight: 800;
            flex-shrink: 0;
        }

        .request-title {
            font-weight: 800;
            font-size: 1rem;
        }

        .hospital {
            color: var(--muted);
            font-size: .79rem;
            margin-top: 3px;
        }

        .distance {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--muted);
            font-size: .78rem;
            margin-top: 12px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 10px;
            border-radius: 50px;
            font-size: .68rem;
            font-weight: 800;
        }

        .notified {
            background: #fff7ed;
            color: #c2410c;
        }

        .accepted-status {
            background: var(--soft-green);
            color: var(--green);
        }

        .declined {
            background: #fef2f2;
            color: #b91c1c;
        }

        .pending {
            background: #f3f4f6;
            color: #6b7280;
        }

        .action-btn {
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: .8rem;
            font-weight: 800;
        }

        .accept-btn {
            background: var(--red);
            color: white;
        }

        .accept-btn:hover {
            background: var(--red-dark);
            color: white;
        }

        .decline-btn {
            background: #f4f4f5;
            color: #555;
        }

        .decline-btn:hover {
            background: #e9e9ea;
        }

        .privacy-note {
            background: #f7f7f7;
            border-radius: 12px;
            padding: 11px 13px;
            color: #777;
            font-size: .73rem;
            margin-top: 15px;
        }

        .privacy-note i {
            color: var(--red);
        }

        .accepted-note {
            background: var(--soft-green);
            color: var(--green);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: .76rem;
            font-weight: 700;
            margin-top: 15px;
        }

        .empty-state {
            background: white;
            border: 1px dashed #d8d8d8;
            border-radius: 20px;
            padding: 65px 25px;
            text-align: center;
        }

        .empty-icon {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            background: var(--soft-red);
            color: var(--red);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 1.7rem;
        }

        .empty-state h4 {
            font-weight: 800;
        }

        .empty-state p {
            color: var(--muted);
            max-width: 480px;
            margin: 0 auto;
            line-height: 1.7;
            font-size: .84rem;
        }

        .alert {
            border: none;
            border-radius: 12px;
        }

        @media (max-width: 767px) {

            .page {
                padding: 28px 0 50px;
            }

            .page-header h1 {
                font-size: 2.15rem;
            }

            .match-card {
                padding: 19px;
            }

            .action-area {
                width: 100%;
            }

            .action-area form {
                flex: 1;
            }

            .action-btn {
                width: 100%;
            }

        }

    </style>

<body>

<nav class="navbar sticky-top"><div class="container"><div class="d-flex justify-content-between align-items-center w-100"><a href="/donor-dashboard.html" class="brand"><span>🩸</span> BloodLink</a><div class="d-flex gap-3"><a href="/notifications.html" class="nav-link-custom">Notifications</a><a href="#" id="logoutLink" class="nav-link-custom">Logout</a></div></div></div></nav>
<main class="page"><div class="container"><div class="page-header mb-4"><div class="eyebrow">Donor center</div><h1>Your blood matches</h1><p class="mb-0">These are blood requests for which you were identified as an eligible donor. Review the details and decide whether you can help.</p></div><div id="errorMessage" class="alert alert-danger mb-4" style="display:none"></div><div id="matchList"></div></div></main>
<script>
const user=requireAuth("DONOR");if(user){logoutLink.onclick=async e=>{e.preventDefault();await logoutUser();location.href="/";};loadMatches();}
async function loadMatches(){try{const d=await getMatches();const arr=d.results||d.matches||d||[];matchList.innerHTML=arr.length?arr.map(m=>{const r=m.request||{};const status=(m.status||"PENDING").toUpperCase();return `<div class="match-card ${status==="ACCEPTED"?"accepted":""}"><div class="row align-items-start g-3"><div class="col-lg-7"><div class="d-flex gap-3"><div class="blood-badge">${r.blood_group||"—"}</div><div><div class="request-title">Blood request near you</div><div class="hospital"><i class="bi bi-hospital-fill me-1"></i>${r.hospital_name||"Hospital"}</div><div class="hospital"><i class="bi bi-geo-alt-fill me-1"></i>${r.hospital_address||""}</div><div class="distance"><i class="bi bi-signpost-2-fill"></i> ${m.distance_km??"—"} km away</div></div></div></div><div class="col-lg-5 d-flex justify-content-lg-end"><span class="status">${status}</span></div></div><div class="row g-3 mt-2 pt-3" style="border-top:1px solid #f1f1f1"><div class="col-md-4"><small>Blood required</small><strong class="d-block">${r.blood_group||"—"}</strong></div><div class="col-md-4"><small>Units</small><strong class="d-block">${r.units_required||"—"}</strong></div><div class="col-md-4"><small>Urgency</small><strong class="d-block">${r.urgency||"—"}</strong></div></div>${status==="NOTIFIED"?`<div class="d-flex gap-2 justify-content-end mt-3"><button class="action-btn decline-btn" onclick="respond(${m.id},false)">Decline</button><button class="action-btn accept-btn" onclick="respond(${m.id},true)">Accept & Help</button></div>`:""}</div>`;}).join(""):`<div class="empty-state"><h4>No matches yet.</h4><p>New eligible blood requests will appear here.</p></div>`;}catch(e){showMessage("errorMessage",e.message);}}
async function respond(id,accept){try{accept?await acceptMatch(id):await declineMatch(id);loadMatches();}catch(e){showMessage("errorMessage",e.message);}}
</script>
