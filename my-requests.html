<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Blood Requests | BloodLink</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<style>

        :root {
            --red: #c81d25;
            --red-dark: #a9151d;
            --soft-red: #fff1f2;
            --dark: #171717;
            --muted: #6b7280;
            --border: #eeeeee;
            --background: #f8f8f8;
            --green: #16803c;
            --soft-green: #ecfdf3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--background);
            color: var(--dark);
            font-family: "DM Sans", sans-serif;
        }

        h1, h2, h3, h4, h5 {
            font-family: "Manrope", sans-serif;
        }

        .navbar {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 14px 0;
        }

        .brand {
            text-decoration: none;
            color: var(--dark);
            font-family: "Manrope", sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
        }

        .brand span {
            color: var(--red);
        }

        .nav-link-custom {
            color: #555;
            text-decoration: none;
            font-weight: 600;
            font-size: .9rem;
        }

        .nav-link-custom:hover {
            color: var(--red);
        }

        .page {
            padding: 42px 0 70px;
        }

        .eyebrow {
            color: var(--red);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: .73rem;
            font-weight: 800;
        }

        .page-header h1 {
            font-size: 2.55rem;
            font-weight: 800;
            margin: 6px 0 8px;
            letter-spacing: -.8px;
        }

        .page-header p {
            color: var(--muted);
            max-width: 650px;
            line-height: 1.7;
        }

        .create-btn {
            background: var(--red);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            padding: 12px 17px;
            font-size: .85rem;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .create-btn:hover {
            background: var(--red-dark);
            color: white;
        }

        /* REQUEST CARD */

        .request-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 19px;
            padding: 23px;
            margin-bottom: 15px;
            transition: .2s;
        }

        .request-card:hover {
            border-color: #ddd;
            transform: translateY(-1px);
        }

        .blood-badge {
            width: 54px;
            height: 54px;
            border-radius: 15px;
            background: var(--soft-red);
            color: var(--red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Manrope", sans-serif;
            font-weight: 800;
            font-size: .95rem;
            flex-shrink: 0;
        }

        .request-title {
            font-weight: 800;
            font-size: 1.05rem;
            margin-bottom: 3px;
        }

        .request-date {
            color: #999;
            font-size: .75rem;
        }

        .request-meta {
            color: var(--muted);
            font-size: .82rem;
            margin-top: 14px;
        }

        .request-meta div {
            margin-bottom: 6px;
        }

        .request-meta i {
            width: 18px;
        }

        /* STATUS */

        .status {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 10px;
            border-radius: 50px;
            font-size: .7rem;
            font-weight: 800;
        }

        .status-open {
            background: #fff7ed;
            color: #c2410c;
        }

        .status-partial {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .status-fulfilled {
            background: var(--soft-green);
            color: var(--green);
        }

        .status-cancelled,
        .status-expired {
            background: #f4f4f5;
            color: #71717a;
        }

        /* URGENCY */

        .urgency {
            font-size: .7rem;
            font-weight: 800;
            padding: 5px 9px;
            border-radius: 50px;
        }

        .urgency-critical {
            background: #fee2e2;
            color: #b91c1c;
        }

        .urgency-high {
            background: #ffedd5;
            color: #c2410c;
        }

        .urgency-medium {
            background: #fef3c7;
            color: #92400e;
        }

        .urgency-low {
            background: #f3f4f6;
            color: #4b5563;
        }

        /* PROGRESS */

        .progress-wrap {
            min-width: 150px;
        }

        .progress-label {
            font-size: .72rem;
            color: var(--muted);
            margin-bottom: 5px;
        }

        .progress {
            height: 7px;
            border-radius: 50px;
            background: #eee;
        }

        .progress-bar {
            background: var(--red);
            border-radius: 50px;
        }

        /* EMPTY */

        .empty-state {
            background: white;
            border: 1px dashed #d8d8d8;
            border-radius: 20px;
            padding: 65px 25px;
            text-align: center;
        }

        .empty-icon {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            background: var(--soft-red);
            color: var(--red);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 1.7rem;
        }

        .empty-state h4 {
            font-weight: 800;
        }

        .empty-state p {
            color: var(--muted);
            max-width: 460px;
            margin: 0 auto 22px;
            line-height: 1.7;
        }

        .alert {
            border: none;
            border-radius: 12px;
        }

        @media (max-width: 767px) {

            .page {
                padding: 28px 0 50px;
            }

            .page-header h1 {
                font-size: 2.15rem;
            }

            .header-actions {
                width: 100%;
            }

            .create-btn {
                width: 100%;
                justify-content: center;
            }

            .request-card {
                padding: 19px;
            }

            .progress-wrap {
                min-width: 100%;
                margin-top: 15px;
            }

        }

    </style>

<body>

<nav class="navbar sticky-top"><div class="container"><div class="d-flex justify-content-between align-items-center w-100"><a href="/requester-dashboard.html" class="brand"><span>🩸</span> BloodLink</a><div class="d-flex gap-3"><a href="/requester-dashboard.html" class="nav-link-custom">Dashboard</a><a href="/create-request.html" class="nav-link-custom">New Request</a><a href="#" id="logoutLink" class="nav-link-custom">Logout</a></div></div></div></nav>
<main class="page"><div class="container"><div class="d-flex justify-content-between align-items-end gap-4 flex-wrap mb-4"><div class="page-header"><div class="eyebrow">Request management</div><h1>My blood requests</h1><p class="mb-0">Track the blood requests you've created, their current status and matched donors.</p></div><a class="create-btn" href="/create-request.html"><i class="bi bi-plus-lg"></i> New Blood Request</a></div>
<div id="errorMessage" class="alert alert-danger mb-4" style="display:none"></div><div id="requestList"></div></div></main>
<script>
const user=requireAuth("REQUESTER");if(user){logoutLink.onclick=async e=>{e.preventDefault();await logoutUser();location.href="/";};loadRequests();}
async function loadRequests(){try{const data=await getBloodRequests();const arr=data.results||data.requests||data||[];requestList.innerHTML=arr.length?arr.map(r=>`<div class="request-card"><div class="d-flex justify-content-between align-items-start gap-3 flex-wrap"><div class="d-flex gap-3"><div class="blood-badge">${r.blood_group}</div><div><div class="request-title">${r.hospital_name}</div><div class="request-date">Created ${formatDate(r.created_at)}</div></div></div><div class="d-flex gap-2 align-items-center flex-wrap"><span class="status status-open">${r.status||"OPEN"}</span><span class="urgency urgency-${(r.urgency||"LOW").toLowerCase()}">${r.urgency||"LOW"}</span></div></div><div class="request-meta"><div><i class="bi bi-droplet-fill"></i><strong>${r.blood_group}</strong> · ${r.units_required} units required</div><div><i class="bi bi-geo-alt-fill"></i>${r.hospital_address}</div><div><i class="bi bi-bullseye"></i>Donor search radius: ${r.radius_km} km</div></div><div class="mt-3"><a class="view-btn" href="/request-detail.html?id=${r.id}">View Request</a></div></div>`).join(""):`<div class="empty-state"><h4>No blood requests yet.</h4><a href="/create-request.html">Create Your First Request</a></div>`;}catch(e){showMessage("errorMessage",e.message);}}
function formatDate(v){return v?new Date(v).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"}):"";}
</script>


</body>
