<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Blood Requests | BloodLink</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<script src="/static/js/api.js"></script>

<style>
:root{
--red:#c81d25;--red-dark:#a9151d;--soft-red:#fff1f2;
--dark:#171717;--muted:#6b7280;--border:#eeeeee;
--background:#f8f8f8;--green:#16803c;--soft-green:#ecfdf3
}

*{box-sizing:border-box}

body{
margin:0;background:var(--background);
color:var(--dark);font-family:"DM Sans",sans-serif
}

h1,h2,h3,h4,h5{font-family:"Manrope",sans-serif}

.navbar{
background:white;border-bottom:1px solid var(--border);padding:14px 0
}

.brand{
display:flex;align-items:center;gap:10px;
text-decoration:none;color:var(--dark);
font-family:"Manrope";font-size:1.4rem;font-weight:800
}

.brand-icon{
width:42px;height:42px;border-radius:11px;
background:var(--red);position:relative;display:inline-block
}

.brand-icon:before{
content:"";position:absolute;width:9px;height:27px;
background:#fff;border-radius:3px;left:16.5px;top:7.5px
}

.brand-icon:after{
content:"";position:absolute;width:27px;height:9px;
background:#fff;border-radius:3px;left:7.5px;top:16.5px
}

.nav-link-custom{
color:#555;text-decoration:none;font-weight:600;font-size:.9rem
}

.nav-link-custom:hover{color:var(--red)}

.page{padding:42px 0 70px}

.eyebrow{
color:var(--red);text-transform:uppercase;
letter-spacing:1.5px;font-size:.73rem;font-weight:800
}

.page-header h1{
font-size:2.55rem;font-weight:800;
margin:6px 0 8px;letter-spacing:-.8px
}

.page-header p{
color:var(--muted);max-width:650px;line-height:1.7
}

.create-btn{
background:var(--red);color:white;text-decoration:none;
border-radius:10px;padding:12px 17px;font-size:.85rem;
font-weight:800;display:inline-flex;align-items:center;gap:7px
}

.create-btn:hover{background:var(--red-dark);color:white}

.request-card{
background:white;border:1px solid var(--border);
border-radius:19px;padding:23px;margin-bottom:15px;
transition:.2s
}

.request-card:hover{
border-color:#ddd;transform:translateY(-1px)
}

.blood-badge{
width:54px;height:54px;border-radius:15px;
background:var(--soft-red);color:var(--red);
display:flex;align-items:center;justify-content:center;
font-family:"Manrope";font-weight:800;font-size:.95rem;
flex-shrink:0
}

.request-title{font-weight:800;font-size:1.05rem;margin-bottom:3px}
.request-date{color:#999;font-size:.75rem}

.request-meta{
color:var(--muted);font-size:.82rem;margin-top:14px
}

.request-meta div{margin-bottom:6px}
.request-meta i{width:18px}

.status{
display:inline-flex;align-items:center;gap:5px;
padding:6px 10px;border-radius:50px;
font-size:.7rem;font-weight:800
}

.status-open{background:#fff7ed;color:#c2410c}
.status-partial{background:#eff6ff;color:#1d4ed8}
.status-fulfilled{background:var(--soft-green);color:var(--green)}
.status-cancelled,.status-expired{background:#f4f4f5;color:#71717a}

.urgency{
font-size:.7rem;font-weight:800;
padding:5px 9px;border-radius:50px
}

.urgency-critical{background:#fee2e2;color:#b91c1c}
.urgency-high{background:#ffedd5;color:#c2410c}
.urgency-medium{background:#fef3c7;color:#92400e}
.urgency-low{background:#f3f4f6;color:#4b5563}

.progress-wrap{min-width:150px}

.progress-label{
font-size:.72rem;color:var(--muted);margin-bottom:5px
}

.progress{height:7px;border-radius:50px;background:#eee}
.progress-bar{background:var(--red);border-radius:50px}

.empty-state{
background:white;border:1px dashed #d8d8d8;
border-radius:20px;padding:65px 25px;text-align:center
}

.empty-icon{
width:68px;height:68px;border-radius:18px;
background:var(--soft-red);color:var(--red);
display:flex;align-items:center;justify-content:center;
margin:0 auto 18px;font-size:1.7rem
}

.empty-state h4{font-weight:800}
.empty-state p{
color:var(--muted);max-width:460px;
margin:0 auto 22px;line-height:1.7
}

@media(max-width:767px){
.page{padding:28px 0 50px}
.page-header h1{font-size:2.15rem}
.create-btn{width:100%;justify-content:center}
.request-card{padding:19px}
.progress-wrap{min-width:100%;margin-top:15px}
}
</style>

</head>

<body>

<nav class="navbar sticky-top">

<div class="container d-flex justify-content-between align-items-center">

<a href="/requester-dashboard.html" class="brand">
<span class="brand-icon"></span>
<span>Blood<span style="color:var(--red)">Link</span></span>
</a>

<div class="d-flex gap-3">

<a href="/requester-dashboard.html" class="nav-link-custom">
Dashboard
</a>

<a href="#" id="logoutLink" class="nav-link-custom">
Logout
</a>

</div>

</div>

</nav>

<main class="page">

<div class="container">

<div class="d-flex justify-content-between align-items-end gap-4 flex-wrap mb-4">

<div class="page-header">

<div class="eyebrow">
Request management
</div>

<h1>My blood requests</h1>

<p class="mb-0">
Track the blood requests you've created, their current status
and matched donors.
</p>

</div>

<div>
<a href="/create-request.html" class="create-btn">
<i class="bi bi-plus-lg"></i>
New Blood Request
</a>
</div>

</div>

<div id="message"></div>

<div id="requestsContainer">

<div class="text-center py-5 text-muted">
<i class="bi bi-arrow-repeat"></i>
Loading requests...
</div>

</div>

</div>

</main>

<script>

const user=requireAuth("REQUESTER");

if(user){

document.getElementById("logoutLink").onclick=async e=>{
e.preventDefault();
await logoutUser();
window.location.href="/";
};

async function loadRequests(){

const container=document.getElementById("requestsContainer");

try{

const data=await getBloodRequests();

const requests=Array.isArray(data)
?data
:(data.results||data.requests||[]);

if(!requests.length){

container.innerHTML=`

<div class="empty-state">

<div class="empty-icon">
<i class="bi bi-droplet-half"></i>
</div>

<h4>No blood requests yet</h4>

<p>
When you need blood, create a request and BloodLink
will search for compatible and eligible donors nearby.
</p>

<a href="/create-request.html" class="create-btn">
<i class="bi bi-plus-lg"></i>
Create Your First Request
</a>

</div>

`;

return;
}

container.innerHTML=requests.map(r=>{

const required=Number(r.units_required||0);
const fulfilled=Number(r.units_fulfilled||r.units_fulfilled||0);

const progress=required
?Math.min(100,(fulfilled/required)*100)
:0;

let statusClass="status-open";
let statusText=r.status||"OPEN";
let statusIcon="bi-circle-fill";

if(statusText==="FULFILLED"){
statusClass="status-fulfilled";
statusIcon="bi-check-circle-fill";
}
else if(statusText==="PARTIALLY_FULFILLED"){
statusClass="status-partial";
statusIcon="bi-pie-chart-fill";
}
else if(statusText==="CANCELLED"){
statusClass="status-cancelled";
statusIcon="bi-x-circle-fill";
}
else if(statusText==="EXPIRED"){
statusClass="status-expired";
statusIcon="bi-clock-fill";
}

const urgency=(r.urgency||"LOW").toUpperCase();

return `

<div class="request-card">

<div class="d-flex justify-content-between align-items-start gap-3 flex-wrap">

<div class="d-flex gap-3">

<div class="blood-badge">
${r.blood_group||"—"}
</div>

<div>

<div class="request-title">
${r.hospital_name||"Hospital"}
</div>

<div class="request-date">
${r.created_at
?new Date(r.created_at).toLocaleString()
:"Blood request"}
</div>

</div>

</div>

<div class="d-flex gap-2 align-items-center flex-wrap">

<span class="status ${statusClass}">
<i class="bi ${statusIcon}"></i>
${statusText.replaceAll("_"," ")}
</span>

<span class="urgency urgency-${urgency.toLowerCase()}">
${urgency}
</span>

</div>

</div>

<div class="request-meta">

<div>
<i class="bi bi-droplet-fill"></i>
<strong>${r.blood_group||"—"}</strong>
· ${required} unit${required===1?"":"s"} required
</div>

<div>
<i class="bi bi-geo-alt-fill"></i>
${r.hospital_address||"Hospital location"}
</div>

<div>
<i class="bi bi-bullseye"></i>
Donor search radius: ${r.radius_km||"—"} km
</div>

</div>

<div class="d-flex justify-content-between align-items-end gap-3 flex-wrap mt-3 pt-3"
style="border-top:1px solid #f0f0f0">

<div class="progress-wrap">

<div class="progress-label">
Blood requirement:
<strong>${fulfilled}/${required}</strong>
</div>

<div class="progress">
<div class="progress-bar" style="width:${progress}%"></div>
</div>

</div>

<a
href="/request-detail.html?id=${r.id}"
class="btn btn-light"
style="border-radius:9px;font-size:.8rem;font-weight:800;padding:9px 14px"
>
View Request
<i class="bi bi-arrow-right ms-1"></i>
</a>

</div>

</div>

`;

}).join("");

}catch(e){

container.innerHTML=
`<div class="alert alert-danger">${e.message}</div>`;

}

}

loadRequests();

}

</script>

</body>
</html>
