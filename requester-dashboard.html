<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Login | BloodLink</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<script src="/static/js/api.js"></script>

<style>
:root{--red:#c81d25;--dark:#171717;--muted:#6b7280}
*{box-sizing:border-box}

body{
margin:0;min-height:100vh;background:#fafafa;
font-family:"DM Sans",sans-serif;color:var(--dark)
}

h1,h2,h3,h4{font-family:"Manrope",sans-serif}

.navbar{
background:white;border-bottom:1px solid #eee;padding:17px 0
}

.brand{
display:flex;align-items:center;gap:10px;
text-decoration:none;color:var(--dark);
font-family:"Manrope";font-size:1.45rem;font-weight:800
}

.brand-icon{
width:42px;height:42px;border-radius:11px;
background:var(--red);position:relative;display:inline-block
}

.brand-icon:before{
content:"";position:absolute;width:9px;height:27px;
background:white;border-radius:3px;left:16.5px;top:7.5px
}

.brand-icon:after{
content:"";position:absolute;width:27px;height:9px;
background:white;border-radius:3px;left:7.5px;top:16.5px
}

.home-link{color:#555;text-decoration:none;font-weight:600}
.home-link:hover{color:var(--red)}

.login-wrapper{padding:55px 0 70px}

.login-card{
background:white;border:1px solid #eee;border-radius:28px;
overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.08)
}

.login-left{
min-height:610px;
background:linear-gradient(145deg,#9f1239,#c81d25 55%,#e33b44);
color:white;padding:55px;
position:relative;overflow:hidden;
display:flex;flex-direction:column;justify-content:flex-end
}

.login-left:after{
content:"+";
position:absolute;right:20px;top:-45px;
font-size:18rem;font-weight:800;opacity:.08
}

.login-left .eyebrow{
color:#ffd9dc;text-transform:uppercase;
letter-spacing:1.5px;font-size:.75rem;font-weight:800
}

.login-left h1{
font-size:3rem;font-weight:800;line-height:1.08;
position:relative;z-index:1
}

.login-left p{
color:#ffe8e9;line-height:1.7;
max-width:420px;position:relative;z-index:1
}

.login-right{padding:55px}

.login-right h2{font-size:2rem;font-weight:800}

.subtitle{color:var(--muted);line-height:1.6}

.form-label{font-size:.9rem;font-weight:700}

.form-control{
padding:13px 14px;border-color:#ddd;border-radius:10px
}

.form-control:focus{
border-color:var(--red);
box-shadow:0 0 0 3px rgba(200,29,37,.08)
}

.login-btn{
width:100%;background:var(--red);color:white;
border:0;padding:14px;border-radius:11px;
font-weight:800;margin-top:10px
}

.login-btn:hover{background:#a9151d}

.register-text{text-align:center;margin-top:22px;color:var(--muted)}
.register-text a{color:var(--red);text-decoration:none;font-weight:800}

.security-note{
margin-top:25px;padding:15px;background:#f7f7f7;
border-radius:12px;color:#666;font-size:.82rem
}

.password-box{position:relative}
.password-box .form-control{padding-right:50px}

.password-toggle{
position:absolute;right:10px;top:50%;
transform:translateY(-50%);
border:0;background:transparent;color:#888
}

@media(max-width:767px){
.login-wrapper{padding:25px 12px}
.login-left{min-height:300px;padding:35px}
.login-left h1{font-size:2.2rem}
.login-right{padding:35px 25px}
}
</style>
</head>

<body>

<nav class="navbar">
<div class="container d-flex justify-content-between align-items-center">

<a href="/" class="brand">
<span class="brand-icon"></span>
<span>Blood<span style="color:var(--red)">Link</span></span>
</a>

<a href="/" class="home-link">
<i class="bi bi-arrow-left me-1"></i>
Back to home
</a>

</div>
</nav>

<main class="login-wrapper">
<div class="container">

<div class="login-card">

<div class="row g-0">

<div class="col-lg-6">
<div class="login-left">

<div class="eyebrow">WELCOME BACK</div>

<h1>Good to see you again.</h1>

<p>
Sign in to manage your blood requests, donor matches
and notifications — all in one place.
</p>

</div>
</div>

<div class="col-lg-6">

<div class="login-right">

<h2>Sign in</h2>

<p class="subtitle mb-4">
Enter your account details to continue.
</p>

<div id="errorMessage" class="alert alert-danger" style="display:none"></div>

<form id="loginForm">

<div class="mb-4">

<label class="form-label" for="username">
Username
</label>

<input
type="text"
id="username"
class="form-control"
placeholder="Enter your username"
autocomplete="username"
required
>

</div>

<div class="mb-4">

<label class="form-label" for="password">
Password
</label>

<div class="password-box">

<input
type="password"
id="password"
class="form-control"
placeholder="Enter your password"
autocomplete="current-password"
required
>

<button type="button" class="password-toggle" id="togglePassword">
<i class="bi bi-eye"></i>
</button>

</div>

</div>

<button type="submit" class="login-btn" id="loginButton">
Sign in
<i class="bi bi-arrow-right ms-2"></i>
</button>

</form>

<div class="register-text">
Don't have an account?
<a href="/register.html">Create one</a>
</div>

<div class="security-note">
<i class="bi bi-shield-check me-1"></i>
Your account information is protected.
</div>

</div>
</div>

</div>
</div>
</div>
</main>

<script>

const password=document.getElementById("password");
const toggle=document.getElementById("togglePassword");

toggle.onclick=function(){

if(password.type==="password"){
password.type="text";
this.innerHTML='<i class="bi bi-eye-slash"></i>';
}else{
password.type="password";
this.innerHTML='<i class="bi bi-eye"></i>';
}

};

document.getElementById("loginForm").addEventListener("submit",async e=>{

e.preventDefault();

const button=document.getElementById("loginButton");

button.disabled=true;
button.innerHTML="Signing in...";

try{

const data=await loginUser(
document.getElementById("username").value.trim(),
password.value
);

window.location.href=
data.user.role==="DONOR"
?"/donor-dashboard.html"
:"/requester-dashboard.html";

}catch(err){

showMessage("errorMessage",err.message);

button.disabled=false;
button.innerHTML='Sign in <i class="bi bi-arrow-right ms-2"></i>';

}

});

</script>

</body>
</html>
